version: '3.9'
services:
  app:
    build: .
    ports:
      - "3000:3000"
    env_file: .env.example
    depends_on:
      - db
      - redis
    volumes:
      - .:/app
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: finjan
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
  redis:
    image: redis:7
    ports:
      - "6379:6379"
